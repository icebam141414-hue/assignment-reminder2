<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่ระบบ | Assignment Reminder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-page">

  <div class="login-info">
    <h1>เข้าสู่ระบบ 👋</h1>
    <p>กรอกอีเมลและรหัสผ่านที่ใช้สมัคร</p>
  </div>

  <div class="login-card">
    <h2>Login</h2>


<form id="loginForm">

  <input
  type="email"
  id="email"
  placeholder="อีเมล"
  required
  style="width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid #ccc;">

  <input
  type="password"
  id="password"
  placeholder="รหัสผ่าน"
  required
  style="width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid #ccc;">

  <button type="submit"
  style="width:100%;padding:14px;border:none;border-radius:8px;background:#06C755;color:white;font-size:16px;">
  เข้าสู่ระบบ
  </button>

</form>

<p style="margin-top:10px;">
  ยังไม่มีบัญชี? <a href="index.html">สมัครสมาชิก</a>
</p>


  </div>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyA0zWQ5f9M7kW9hGyAJ9dtzcPikUQXIPZE",
  authDomain: "assignment-reminder-b1027.firebaseapp.com",
  projectId: "assignment-reminder-b1027",
  storageBucket: "assignment-reminder-b1027.firebasestorage.app",
  messagingSenderId: "334199580488",
  appId: "1:334199580488:web:35a4570922ad7ea0c3b57d",
  measurementId: "G-GK4ZQ9VPS9"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("กรุณากรอกข้อมูลให้ครบ");
    return;
  }

  try {

    await auth.signInWithEmailAndPassword(email, password);

    alert("เข้าสู่ระบบสำเร็จ");

    window.location.href = "dashboard2.html";

  } catch(error){

    console.error(error);

    if(error.code === "auth/user-not-found"){
      alert("ไม่พบบัญชีผู้ใช้");
    }
    else if(error.code === "auth/wrong-password"){
      alert("รหัสผ่านไม่ถูกต้อง");
    }
    else{
      alert(error.message);
    }

  }

});

</script>

</body>
</html>
